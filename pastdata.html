<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=1600">
	<meta name="description" content="Download Deployment Statistics">
	<link rel="icon" type="image/x-icon" href="assets/favicon.png">
	<title>Download Deployment Statistics</title>
	<link rel="stylesheet" type="text/css" href="assets/select2-4.1.0.min.css">
	<link rel="stylesheet" type="text/css" href="assets/dashboard.css">
</head>
<body>
	<div class="flex-row">
		<div class="header">⚡ Smart Meter Deployments in India ⚡</div>
	</div>
	<div class="flex-row">
		<div class="flex-column">
			<div class="text-center">
				<h4 class="warning">Download Past Deployment Statistics</h4>
			</div>
			<div class="text-center">
				<p>Select one or more months to download past cumulative deployment statistics.</p>
			</div>
			<div class="text-center">
				<button class="blues" id="selectAllBtn"><img class="icon" src="assets/check.png">Select All</button>
				<button class="danger" id="clearBtn"><img class="icon" src="assets/clear.png">Clear</button>
			</div>
			<div class="text-center">
				<select id="monthList" multiple></select>
			</div>
			<div class="text-center">
				<button class="success" id="downloadBtn"><img class="icon" src="assets/download.png">Download Data</button>
			</div>
			<div class="text-center">
				<p id="status"></p>
			</div>
		</div>
	</div>
	<script type="text/javascript" src="assets/jquery-3.5.1.js"></script>
	<script type="text/javascript" src="assets/exceljs-4.3.0.min.js"></script>
	<script type="text/javascript" src="assets/select2-4.1.0.min.js"></script>
	<script>
		var url = "https://docs.google.com/spreadsheets/d/1D4h9NnRiN1xv_TlL1TPcP4JucF12W_Qy9dOjOqrCLGk/export?format=xlsx";
		let sourceWorkbook = null;
		function setStatus(message){$("#status").html(message);}
		async function loadWorkbook(){
			try {		
				setStatus("Loading ...");		
				var response = await fetch(url);		
				if(!response.ok){ throw new Error("Unable to access data."); }
				var buffer = await response.arrayBuffer();		
				sourceWorkbook = new ExcelJS.Workbook();
				await sourceWorkbook.xlsx.load(buffer);
				populateMonths();		
				setStatus(sourceWorkbook.worksheets.length + " month(s) loaded.");
			} catch(error) {
				console.error(error); 
				setStatus("Error loading data.");
			}
		}
		function populateMonths(){		
			var select = $("#monthList");
			select.empty();
			var sheetNames = sourceWorkbook.worksheets.map(sheet => sheet.name).reverse();
			sheetNames.forEach(function(sheetName){
				select.append(`<option value="${sheetName}">${sheetName}</option>`);
			});
			select.select2({placeholder:"Select Month(s)",allowClear:true});
		}		
		$("#selectAllBtn").click(function(){		
			var allValues = [];
			$("#monthList option").each(function(){ allValues.push($(this).val()); });$("#monthList").val(allValues).trigger("change");
		});

		$("#clearBtn").click(function(){ 
			$("#monthList").val(null).trigger("change"); 
		});		

		$("#downloadBtn").click(async function(){		
			var selectedSheets = $("#monthList").val();		
			if(!selectedSheets || selectedSheets.length === 0){
				alert("Please select at least one month."); 
				return;
			}
			try {
				setStatus("Generating Workbook...");
				var response = await fetch(url);
				var buffer = await response.arrayBuffer();
				var exportWorkbook = new ExcelJS.Workbook();
				await exportWorkbook.xlsx.load(buffer);
				var sheetsToRemove = [];
				exportWorkbook.eachSheet(function(sheet){if(!selectedSheets.includes(sheet.name)){sheetsToRemove.push(sheet);}});
				sheetsToRemove.forEach(function(sheet){exportWorkbook.removeWorksheet(sheet.id);});
				var outBuffer = await exportWorkbook.xlsx.writeBuffer();
				var blob = new Blob([outBuffer], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
				var now = new Date().toLocaleString('sv-SE',{timeZone:'Asia/Kolkata'}).replace(/\D/g, '');
				var filename = "Smart_Metering_Statistics_History_" + now + ".xlsx";
				var downloadUrl = window.URL.createObjectURL(blob);
				var a = document.createElement('a');
				a.href = downloadUrl;
				a.download = filename;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				window.URL.revokeObjectURL(downloadUrl);
				setStatus("Download Successful.");
			} catch(error) {
				console.error(error);
				setStatus("Error generating workbook.");
			}
		});
		$(document).ready(function(){ loadWorkbook(); });
	</script>
</body>
</html>
